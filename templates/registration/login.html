{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | DAY BY DAY</title>
    <link rel="stylesheet" href="{% static 'course_100days/style.css' %}?v=3">
</head>
<body>
    <main class="page-shell">
        <section class="card" style="max-width: 420px; margin: 4rem auto;">
            <p class="eyebrow">WELCOME BACK</p>
            <h2>Log in</h2>

            {% if form.errors %}
                <p style="color: #b42318;">Wrong username or password. Try again.</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="hidden" name="next" value="{{ next }}">
                <button class="button button-primary" type="submit">Log in</button>
            </form>

            <p style="margin-top: 1.5rem;">No account yet? <a href="{% url 'register' %}">Register</a></p>
        </section>
    </main>
</body>
</html>
